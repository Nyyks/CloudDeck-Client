# Installed by CloudDeck-Client host/install/install.sh. Remove with uninstall.sh.
# Starts Sunshine through a launcher that picks the patched build, or the stock
# /usr/bin/sunshine as a fail-safe (see /var/opt/clouddeck-client/libexec/sunshine-launch).
[Service]
ExecStart=
ExecStart=/var/opt/clouddeck-client/libexec/sunshine-launch
