---
# Raspberry Pi .deb (Raspberry Pi OS Trixie, 64-bit; Pi 4 and Pi 5). Runs tools/build-deb-rpi.sh
# (an arm64 debian:trixie container with Raspberry Pi's archive, under QEMU) on a standard
# x86_64 runner, so it is slow (about 1.5 hours). It links against Raspberry Pi OS's own FFmpeg,
# which has the Pi 5's HEVC hardware decoder (docs/building.md). Tagged builds attach the .deb
# to the GitHub Release; "Run workflow" can attach it to an existing release instead (release_tag).
name: Raspberry Pi
permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach to this existing release, e.g. v1.2.0 (empty: artifact only)'
        required: false
        default: ''

concurrency:
  group: rpi-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive, fetch-depth: 1 }
      - id: v
        name: Version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          BASE=$(tr -d ' \r\n' < client-desktop/app/version.txt)
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ]; then
            V="${TAG#v}"
            [[ "${V%%-*}" == "$BASE" ]] || { echo "Tag $TAG does not match version.txt ($BASE)"; exit 1; }
          else
            V="$BASE-dev.${GITHUB_SHA::7}"
          fi
          echo "CI_VERSION=$V" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - name: Build the Raspberry Pi .deb
        run: bash tools/build-deb-rpi.sh
      - uses: actions/upload-artifact@v6
        with:
          name: raspberrypi-deb
          path: out/linux-arm64/*.deb
          compression-level: 0
          if-no-files-found: error

  release:
    needs: deb
    if: needs.deb.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { name: raspberrypi-deb, path: dist }
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deb.outputs.tag }}
        run: |
          ls -l dist
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "CloudDeck-Client $TAG" --generate-notes $PRE \
              || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          fi
