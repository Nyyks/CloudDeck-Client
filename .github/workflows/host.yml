---
# Host-side builds: patched Sunshine for the CloudDeck VM (Fedora 43 / Bazzite),
# the installable host bundle, and checks of the host install scripts.
name: Host
permissions:
  contents: read

# Normally built locally (host/sunshine-patches/build-local.sh). CI runs on
# release tags or on demand via "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -S warning host/install/*.sh host/install/files/sunshine-* host/install/tests/*.sh host/sunshine-patches/*.sh
      - name: launcher fail-safe tests
        run: bash host/install/tests/test-launch.sh

  sunshine:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install git
        run: dnf -y install git
      - uses: actions/checkout@v5
      - name: Build patched Sunshine
        run: bash host/sunshine-patches/build.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v6
        with:
          name: clouddeck-sunshine-fc43-x86_64
          path: |
            out/*.tar.zst
            out/*.sha256
            out/needed-libs.txt
            out/dropped-files.txt
          if-no-files-found: error

  bundle:
    needs: [scripts, sunshine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: clouddeck-sunshine-fc43-x86_64, path: sun }
      - name: Assemble host bundle
        run: |
          NAME="$(basename sun/clouddeck-sunshine-*.tar.zst .tar.zst)"
          B="clouddeck-host-${NAME#clouddeck-sunshine-}"
          mkdir -p "$B/files"
          cp host/install/install.sh host/install/uninstall.sh "$B/"
          cp host/install/files/* "$B/files/"
          cp sun/*.tar.zst sun/*.sha256 "$B/"
          cp LICENSE "$B/"
          chmod +x "$B"/*.sh "$B"/files/sunshine-*
          tar -czf "$B.tar.gz" "$B"
          sha256sum "$B.tar.gz" > "$B.tar.gz.sha256"
          ls -l
      - uses: actions/upload-artifact@v6
        with:
          name: clouddeck-host-bundle
          path: clouddeck-host-*.tar.gz*
          if-no-files-found: error
